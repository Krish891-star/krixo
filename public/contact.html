<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact and Feedback | KriXo</title><meta name="description" content="Send feedback, report a bug or suggest a useful PDF or image tool for KriXo."><link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png"><link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png"><link rel="apple-touch-icon" href="/favicon-180x180.png"><link rel="manifest" href="/site.webmanifest"><link rel="alternate icon" type="image/svg+xml" href="/favicon.svg"><link rel="stylesheet" href="/assets/styles.css"><script type="module" src="/assets/main.js"></script></head><body><header id="site-header"></header><main class="shell"><section class="page-hero"><div class="breadcrumb"><a href="/">Home</a> / Contact</div><h1>Tell us what could work better.</h1><p>Report a bug, suggest a tool or tell us where the instructions are confusing.</p></section><section class="content-panel"><form id="feedback-form"><div class="form-grid"><div class="field"><label for="name">Name (optional)</label><input id="name" name="name" maxlength="100" placeholder="Your name"></div><div class="field"><label for="email">Email (optional)</label><input id="email" name="email" type="email" maxlength="180" placeholder="you@example.com"></div><div class="field full"><label for="type">What is this about?</label><select id="type" name="type"><option value="bug">Report a bug</option><option value="idea">Suggest a tool</option><option value="other">Something else</option></select></div><div class="field full"><label for="message">Message</label><textarea id="message" name="message" rows="5" required minlength="8" maxlength="3000" placeholder="Tell us what happened or what you would like to see…"></textarea></div></div><div class="action-row"><button class="btn-primary" type="submit">Send feedback ↗</button></div><div id="feedback-status" class="tool-status" role="status"></div><p class="muted-note">Your message is saved so we can reply. Please do not include passwords, identity numbers or private document contents.</p></form></section></main><footer id="site-footer"></footer></body></html>
